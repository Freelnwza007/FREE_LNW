<!doctype html>
<html lang="th">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>เข้าสู่ระบบ | Port Able Coffee</title><link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="animations.css" /><link rel="stylesheet" href="decorations.css" /><link rel="stylesheet" href="right-space.css" /></head>
  <body class="login-page"><header class="auth-nav"><a class="logo" href="/">PORT ABLE <span>COFFEE</span></a><a class="back-link" href="/">กลับไปหน้าร้าน</a></header><main class="auth-layout"><section class="auth-story"><p class="eyebrow">ROASTED WITH INTENTION</p><h1>รสชาติที่ดี<br />เริ่มต้นที่นี่</h1><p>เข้าสู่ระบบเพื่อจัดการคำสั่งซื้อ และให้กาแฟแก้วโปรดเดินทางมาหาคุณได้ง่ายขึ้น</p></section><section class="login-panel standalone-login"><p id="panel-kicker" class="panel-kicker">WELCOME BACK</p><h2 id="login-title">เข้าสู่ระบบ</h2><p id="panel-description" class="panel-description">ยินดีต้อนรับกลับมา เติมพลังให้วันของคุณกัน</p><form id="login-form" novalidate><div id="name-field" class="optional-field is-hidden"><label for="name">ชื่อ</label><input id="name" name="name" type="text" autocomplete="name" placeholder="ชื่อของคุณ" /></div><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /><div class="password-label"><label for="password">รหัสผ่าน</label><a id="forgot-link" href="#">ลืมรหัสผ่าน?</a></div><input id="password" name="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่านของคุณ" minlength="8" required /><p id="login-message" class="form-message" role="alert" aria-live="polite"></p><button id="submit-button" class="login-button" type="submit">เข้าสู่ระบบ <span>→</span></button></form><p class="signup-prompt"><span id="prompt-text">ยังไม่มีบัญชี?</span> <a id="signup-toggle" href="#">สมัครสมาชิก</a></p></section></main><script type="module" src="/login.js"></script></body>
</html>

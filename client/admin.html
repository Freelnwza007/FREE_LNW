<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>จัดการสินค้า | Free Lnw Coffee</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="animations.css"><link rel="stylesheet" href="decorations.css"><link rel="stylesheet" href="right-space.css"></head>
<body class="admin-page"><header class="site-nav"><a class="logo" href="/">FREE <span>LNW</span></a><nav><a href="/">กลับหน้าร้าน</a><a href="/login.html">บัญชี</a></nav></header>
<main class="admin-layout"><section class="admin-intro"><p class="eyebrow">ADMIN CONSOLE</p><h1>จัดการเมนู<br>ของร้าน</h1><p>เพิ่ม แก้ไข และลบสินค้าที่แสดงในหน้าร้านได้จากที่เดียว</p></section><section class="admin-panel"><div class="admin-heading"><div><p class="eyebrow">PRODUCT CATALOGUE</p><h2 id="form-title">เพิ่มสินค้าใหม่</h2></div><button id="cancel-edit" class="text-button is-hidden" type="button">ยกเลิกแก้ไข</button></div><p id="admin-message" class="form-message" aria-live="polite"></p><form id="product-form" class="product-form"><input id="product-id" type="hidden"><label>ชื่อสินค้า<input id="name" required maxlength="100" placeholder="เช่น Iced Americano"></label><label>คำอธิบาย<textarea id="description" rows="3" maxlength="500" placeholder="บรรยายรสชาติหรือจุดเด่น"></textarea></label><div class="form-grid"><label>หมวดหมู่<select id="product-type"><option value="coffee">กาแฟ</option><option value="tea">ชา</option><option value="bakery">ขนมอบ</option><option value="milk">นม</option><option value="refresher">เครื่องดื่ม</option><option value="accessory">อุปกรณ์</option></select></label><label>สถานะ<select id="is-active"><option value="true">แสดงในร้าน</option><option value="false">ซ่อนชั่วคราว</option></select></label></div><label>อัปโหลดรูปสินค้า<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p class="upload-hint">รองรับ JPG, PNG, WEBP, GIF ขนาดไม่เกิน 5 MB</p><label>หรือลิงก์รูปภาพ<input id="image" type="url" placeholder="https://images.example.com/coffee.jpg"></label><div class="form-grid"><label>ขนาด / ตัวเลือก<input id="size" required value="Regular"></label><label>SKU<input id="sku" required placeholder="COF-001"></label><label>ราคา (บาท)<input id="price" required type="number" min="0" step="1" placeholder="95"></label><label>จำนวนคงเหลือ<input id="stock" required type="number" min="0" step="1" value="0"></label></div><button class="admin-submit" type="submit">บันทึกสินค้า <span>→</span></button></form></section><section class="admin-products"><div class="admin-heading"><div><p class="eyebrow">CURRENT MENU</p><h2>สินค้าทั้งหมด</h2></div><button id="refresh-products" class="text-button" type="button">รีเฟรช</button></div><div id="admin-product-list" class="admin-product-list"></div></section></main><script type="module" src="/admin.js"></script></body></html>
